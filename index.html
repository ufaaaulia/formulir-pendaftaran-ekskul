<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Pendaftaran Klub Coding</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="form-card">
		<div class="form-header">
			<span class="badge">GEN-Z Developer</span>
			<h2>Join Coding Club</h2>
			<p>Daftarkan dirimu dan mulai bikin web keren bersama!</p>
		</div>

		<form>
			<div class="input-group">
				<label for="nama">Nama Lengkap</label>
				<input type="text" id="nama" placeholder="Contoh: Lorem Ipsum Dolor sit amet" required>
			</div>

			<div class="input-group">
				<label for="kelas">kelas</label>
				<input type="text" id="kelas" placeholder="Contoh: XI RPL 1" required>
			</div>

			<div class="input-group">
				<label for="alasan">Kenapa ingin bergabung?</label>
				<textarea id="alasan" rows="3" placeholder="Tulis alasan singkatmu" required></textarea>
			</div>

			<button type="submit" class="btn-submit">Send</button>
		</form>
	</div>
</body>
</html>
